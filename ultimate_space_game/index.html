<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jeds Game</title>
    <meta name="description" content="Jeds Game: a space shooter with a flight-school tutorial, power-ups, cruisers, and shops. Play it free in your browser." />
    <meta property="og:title" content="Jeds Game" />
    <meta property="og:description" content="A space shooter with a flight-school tutorial, power-ups, cruisers, and shops. Play it free in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://thekajopelayeolas-tech.github.io/games/ultimate_space_game/assets/space_intruder/sprites/space_cruiser_7_flipped.png" />
    <link rel="icon" type="image/png" href="./assets/space_intruder/sprites/space_cruiser_7_flipped.png" />
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            width: 100%;
            background: #050505;
            background-image: linear-gradient(#111 1px, transparent 1px),
                              linear-gradient(90deg, #111 1px, transparent 1px);
            background-size: 40px 40px;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            display: block;
        }
        /* Base Styles */
        #game-root {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #fullscreen-button {
            position: fixed;
            z-index: 10;
            top: max(12px, env(safe-area-inset-top));
            right: max(12px, env(safe-area-inset-right));
            padding: 10px 14px;
            min-height: 44px;
            touch-action: manipulation;
            border: 2px solid #00ff00;
            border-radius: 4px;
            background: #000;
            color: #00ff00;
            font: 700 14px 'Courier New', monospace;
            cursor: pointer;
            box-shadow: 0 0 10px #00ff00;
        }
        #fullscreen-button:hover { background: #002200; }
        body:fullscreen #fullscreen-button { top: max(12px, env(safe-area-inset-top)); }
        #rotate-hint {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: #000;
            color: #00ff00;
            font: 700 20px/1.5 'Courier New', monospace;
            text-align: center;
            border: 4px solid #00ff00;
        }
        #rotate-hint span { display: block; margin-bottom: 14px; font-size: 54px; }
        @media (orientation: portrait) and (max-width: 900px) {
            #rotate-hint { display: flex; }
        }
    </style>
</head>
<body>
    <div id="game-root"></div>
    <button id="fullscreen-button" type="button" aria-label="Enter fullscreen">1 · Fullscreen</button>
    <div id="rotate-hint" role="status"><div><span aria-hidden="true">📱↻</span>Rotate your device sideways for the best game controls.</div></div>
    <script src="./game_v2.js?v=borders-solid-1"></script>
</body>
</html>
